<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Assistant | Intelligent Document Analysis</title>
  <meta name="description" content="Upload documents and ask questions. Powered by Gemini and MongoDB Vector Search.">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <h1>DocuMind <span>AI</span></h1>
      </div>
      <p class="subtitle">Retrieval-Augmented Generation Workspace</p>
    </header>

    <main class="main-content">
      <section class="upload-section">
        <h2>Knowledge Base</h2>
        <div class="upload-box" id="uploadBox">
          <input type="file" id="fileInput" accept=".txt, .pdf" hidden>
          <div class="upload-content">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="upload-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <p>Drag & drop your PDF or TXT here</p>
            <button class="btn-primary" id="browseBtn">Browse Files</button>
          </div>
          <div class="upload-status" id="uploadStatus"></div>
        </div>
      </section>

      <section class="chat-section">
        <h2>Ask the AI</h2>
        <div class="chat-container">
          <div class="messages" id="chatMessages">
            <div class="message ai-message">
              <div class="message-bubble">Hello! Upload a document above, then ask me questions about it.</div>
            </div>
          </div>
          <div class="input-area">
            <input type="text" id="questionInput" placeholder="Ask a question about your document..." autocomplete="off">
            <button id="sendBtn" class="btn-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
